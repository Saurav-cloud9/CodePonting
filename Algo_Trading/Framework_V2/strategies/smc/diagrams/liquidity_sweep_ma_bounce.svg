<svg viewBox="0 0 820 460" xmlns="http://www.w3.org/2000/svg" font-family="monospace">
  <rect width="820" height="460" fill="#0f172a"/>
  <text x="20" y="28" fill="#e2e8f0" font-size="16" font-weight="bold">Liquidity Sweep → MA20 Bounce (synthetic illustration)</text>

  <!-- price axis labels -->
  <text x="10" y="24" fill="#64748b" font-size="11">130</text>
  <text x="10" y="144" fill="#64748b" font-size="11">120</text>
  <text x="10" y="264" fill="#64748b" font-size="11">110</text>
  <text x="10" y="384" fill="#64748b" font-size="11">100</text>
  <line x1="35" y1="20" x2="800" y2="20" stroke="#1e293b"/>
  <line x1="35" y1="140" x2="800" y2="140" stroke="#1e293b"/>
  <line x1="35" y1="260" x2="800" y2="260" stroke="#1e293b"/>
  <line x1="35" y1="380" x2="800" y2="380" stroke="#1e293b"/>

  <!-- swing low / liquidity pool line -->
  <line x1="220" y1="260" x2="620" y2="260" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="630" y="264" fill="#a78bfa" font-size="12">Prior Swing Low = Liquidity Pool</text>

  <!-- MA20 line -->
  <polyline fill="none" stroke="#f59e0b" stroke-width="2.5"
    points="60,68 100,80 140,92 180,104 220,116 260,128 300,140 340,152 380,158 420,164 460,170 500,176 540,184.4 580,192.8 620,200 660,206 700,209.6 740,212" />
  <text x="650" y="195" fill="#f59e0b" font-size="12">MA20</text>

  <!-- candles -->
  <g stroke-width="1.5">
    <!-- 1 bullish -->
    <line x1="60" y1="116" x2="60" y2="164" stroke="#22c55e"/><rect x="49" y="128" width="22" height="12" fill="#22c55e"/>
    <!-- 2 bearish -->
    <line x1="100" y1="104" x2="100" y2="152" stroke="#ef4444"/><rect x="89" y="128" width="22" height="12" fill="#ef4444"/>
    <!-- 3 bearish -->
    <line x1="140" y1="128" x2="140" y2="188" stroke="#ef4444"/><rect x="129" y="140" width="22" height="36" fill="#ef4444"/>
    <!-- 4 bearish -->
    <line x1="180" y1="164" x2="180" y2="224" stroke="#ef4444"/><rect x="169" y="176" width="22" height="36" fill="#ef4444"/>
    <!-- 5 bearish (swing low forms, low=260) -->
    <line x1="220" y1="200" x2="220" y2="260" stroke="#ef4444"/><rect x="209" y="212" width="22" height="36" fill="#ef4444"/>
    <!-- 6 bullish -->
    <line x1="260" y1="212" x2="260" y2="248" stroke="#22c55e"/><rect x="249" y="224" width="22" height="24" fill="#22c55e"/>
    <!-- 7 bullish -->
    <line x1="300" y1="188" x2="300" y2="236" stroke="#22c55e"/><rect x="289" y="200" width="22" height="24" fill="#22c55e"/>
    <!-- 8 bullish -->
    <line x1="340" y1="176" x2="340" y2="212" stroke="#22c55e"/><rect x="329" y="188" width="22" height="12" fill="#22c55e"/>
    <!-- 9 bullish -->
    <line x1="380" y1="164" x2="380" y2="200" stroke="#22c55e"/><rect x="369" y="176" width="22" height="12" fill="#22c55e"/>
    <!-- 10 bullish -->
    <line x1="420" y1="152" x2="420" y2="188" stroke="#22c55e"/><rect x="409" y="164" width="22" height="12" fill="#22c55e"/>
    <!-- 11 bearish -->
    <line x1="460" y1="140" x2="460" y2="176" stroke="#ef4444"/><rect x="449" y="164" width="22" height="12" fill="#ef4444"/>
    <!-- 12 bearish -->
    <line x1="500" y1="164" x2="500" y2="224" stroke="#ef4444"/><rect x="489" y="176" width="22" height="36" fill="#ef4444"/>
    <!-- 13 bearish -->
    <line x1="540" y1="200" x2="540" y2="248" stroke="#ef4444"/><rect x="529" y="212" width="22" height="24" fill="#ef4444"/>
    <!-- 14 SWEEP candle: long lower wick to 104 (y=332), below swing low + MA -->
    <line x1="580" y1="224" x2="580" y2="332" stroke="#eab308" stroke-width="2.5"/><rect x="569" y="236" width="22" height="12" fill="#ef4444"/>
    <!-- 15 bounce candle, crosses MA -->
    <line x1="620" y1="188" x2="620" y2="260" stroke="#22c55e"/><rect x="609" y="200" width="22" height="48" fill="#22c55e"/>
    <!-- 16 continuation above MA -->
    <line x1="660" y1="152" x2="660" y2="212" stroke="#22c55e"/><rect x="649" y="164" width="22" height="36" fill="#22c55e"/>
    <!-- 17 -->
    <line x1="700" y1="128" x2="700" y2="176" stroke="#22c55e"/><rect x="689" y="140" width="22" height="24" fill="#22c55e"/>
    <!-- 18 -->
    <line x1="740" y1="104" x2="740" y2="152" stroke="#22c55e"/><rect x="729" y="116" width="22" height="24" fill="#22c55e"/>
  </g>

  <!-- annotation: sweep -->
  <circle cx="580" cy="332" r="9" fill="none" stroke="#eab308" stroke-width="2"/>
  <text x="595" y="350" fill="#eab308" font-size="12">Sweep: wick pierces swing low</text>
  <text x="595" y="365" fill="#eab308" font-size="12">+ trades below MA20 (stops run)</text>

  <!-- annotation: bounce -->
  <circle cx="620" cy="224" r="9" fill="none" stroke="#22c55e" stroke-width="2"/>
  <text x="635" y="100" fill="#22c55e" font-size="12">Close back above MA20 →</text>
  <text x="635" y="115" fill="#22c55e" font-size="12">bounce confirmed</text>
  <line x1="635" y1="120" x2="650" y2="170" stroke="#22c55e" stroke-width="1"/>

  <text x="20" y="445" fill="#64748b" font-size="11">Synthetic example — verify live on TradingView Replay (e.g. POWERGRID Dec'22)</text>
</svg>
