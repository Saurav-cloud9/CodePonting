<svg viewBox="0 0 660 400" xmlns="http://www.w3.org/2000/svg" font-family="monospace">
  <rect width="660" height="400" fill="#0f172a"/>
  <text x="20" y="26" fill="#e2e8f0" font-size="15" font-weight="bold">Order Block — formation + retest near MA20</text>

  <!-- price axis -->
  <text x="10" y="95" fill="#64748b" font-size="11">115</text>
  <text x="10" y="225" fill="#64748b" font-size="11">106</text>
  <text x="10" y="310" fill="#64748b" font-size="11">100</text>
  <line x1="32" y1="92" x2="640" y2="92" stroke="#1e293b"/>
  <line x1="32" y1="221.6" x2="640" y2="221.6" stroke="#1e293b"/>
  <line x1="32" y1="308" x2="640" y2="308" stroke="#1e293b"/>

  <!-- Order Block zone (last down candle's full range, 100-105) -->
  <rect x="178" y="236" width="349" height="72" fill="#22c55e" opacity="0.15"/>
  <text x="350" y="330" fill="#86efac" font-size="12">Order Block zone (100–105) = demand</text>

  <!-- MA20 -->
  <polyline fill="none" stroke="#f59e0b" stroke-width="2.5"
    points="60,164 125,192.8 190,221.6 255,250.4 320,236 385,221.6 450,228.8 515,236 580,221.6" />
  <text x="585" y="218" fill="#f59e0b" font-size="12">MA20</text>

  <!-- candles -->
  <g stroke-width="1.5">
    <!-- 1 bearish -->
    <line x1="60" y1="149.6" x2="60" y2="221.6" stroke="#ef4444"/><rect x="48" y="164" width="24" height="43.2" fill="#ef4444"/>
    <!-- 2 bearish -->
    <line x1="125" y1="192.8" x2="125" y2="264.8" stroke="#ef4444"/><rect x="113" y="207.2" width="24" height="43.2" fill="#ef4444"/>
    <!-- 3 OB candle (last down candle before displacement) -->
    <line x1="190" y1="236" x2="190" y2="308" stroke="#eab308" stroke-width="2.5"/><rect x="178" y="250.4" width="24" height="43.2" fill="#ef4444"/>
    <!-- 4 displacement candle (strong break up) -->
    <line x1="255" y1="135.2" x2="255" y2="308" stroke="#22c55e"/><rect x="243" y="149.6" width="24" height="144" fill="#22c55e"/>
    <!-- 5 continuation -->
    <line x1="320" y1="77.6" x2="320" y2="164" stroke="#22c55e"/><rect x="308" y="92" width="24" height="57.6" fill="#22c55e"/>
    <!-- 6 bearish pullback starts -->
    <line x1="385" y1="77.6" x2="385" y2="192.8" stroke="#ef4444"/><rect x="373" y="92" width="24" height="86.4" fill="#ef4444"/>
    <!-- 7 retest: wick drops into OB zone -->
    <line x1="450" y1="164" x2="450" y2="293.6" stroke="#eab308" stroke-width="2.5"/><rect x="438" y="178.4" width="24" height="86.4" fill="#ef4444"/>
    <!-- 8 bounce off OB zone -->
    <line x1="515" y1="135.2" x2="515" y2="279.2" stroke="#22c55e"/><rect x="503" y="149.6" width="24" height="115.2" fill="#22c55e"/>
    <!-- 9 continuation -->
    <line x1="580" y1="92" x2="580" y2="164" stroke="#22c55e"/><rect x="568" y="106.4" width="24" height="43.2" fill="#22c55e"/>
  </g>

  <text x="40" y="60" fill="#94a3b8" font-size="12">#3 = last down candle before the big up move</text>
  <line x1="60" y1="65" x2="195" y2="245" stroke="#94a3b8" stroke-width="1"/>

  <text x="270" y="55" fill="#94a3b8" font-size="12">#4 displacement (strong break up)</text>

  <circle cx="450" cy="293.6" r="9" fill="none" stroke="#eab308" stroke-width="2"/>
  <text x="455" y="350" fill="#eab308" font-size="12">#7-8: price retests OB zone, also</text>
  <text x="455" y="365" fill="#eab308" font-size="12">tags MA20 → rejects → continues up</text>

  <text x="20" y="390" fill="#64748b" font-size="11">Synthetic illustration — not live DS3/POWERGRID data</text>
</svg>
