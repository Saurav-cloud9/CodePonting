<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" font-family="monospace">
  <rect width="720" height="440" fill="#0f172a"/>
  <text x="20" y="26" fill="#e2e8f0" font-size="15" font-weight="bold">Liquidity Sweep — how it generates a BUY signal</text>

  <!-- grid -->
  <line x1="32" y1="80"  x2="700" y2="80"  stroke="#1e293b"/>
  <line x1="32" y1="160" x2="700" y2="160" stroke="#1e293b"/>
  <line x1="32" y1="240" x2="700" y2="240" stroke="#1e293b"/>
  <line x1="32" y1="320" x2="700" y2="320" stroke="#1e293b"/>
  <line x1="32" y1="380" x2="700" y2="380" stroke="#1e293b"/>
  <text x="8" y="84"  fill="#64748b" font-size="11">118</text>
  <text x="8" y="164" fill="#64748b" font-size="11">112</text>
  <text x="8" y="244" fill="#64748b" font-size="11">106</text>
  <text x="8" y="324" fill="#64748b" font-size="11">100</text>
  <text x="8" y="384" fill="#64748b" font-size="11">96</text>

  <!-- step 1 label -->
  <text x="40" y="55" fill="#94a3b8" font-size="12">Step 1: Swing low forms (stops park below it)</text>
  <!-- step 2 label -->
  <text x="310" y="55" fill="#94a3b8" font-size="12">Step 2: Sweep</text>
  <!-- step 3 label -->
  <text x="490" y="55" fill="#94a3b8" font-size="12">Step 3: Buy signal</text>

  <!-- swing low liquidity line -->
  <line x1="160" y1="240" x2="700" y2="240" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="32" y="236" fill="#a78bfa" font-size="11">Swing Low</text>
  <text x="32" y="250" fill="#a78bfa" font-size="11">= stops here</text>

  <!-- stop loss markers below swing low -->
  <text x="175" y="270" fill="#a78bfa" font-size="18">▼▼▼</text>
  <text x="155" y="285" fill="#a78bfa" font-size="10">sell stops resting</text>

  <!-- candles -->
  <g stroke-width="1.5">
    <!-- 1 bearish -->
    <line x1="70"  y1="120" x2="70"  y2="200" stroke="#ef4444"/><rect x="58"  y="140" width="24" height="40" fill="#ef4444"/>
    <!-- 2 bearish -->
    <line x1="130" y1="160" x2="130" y2="220" stroke="#ef4444"/><rect x="118" y="175" width="24" height="30" fill="#ef4444"/>
    <!-- 3 bearish: forms swing low at 106 (y=240) -->
    <line x1="190" y1="200" x2="190" y2="260" stroke="#ef4444"/><rect x="178" y="210" width="24" height="35" fill="#ef4444"/>
    <!-- 4 bullish: small bounce -->
    <line x1="250" y1="170" x2="250" y2="250" stroke="#22c55e"/><rect x="238" y="185" width="24" height="50" fill="#22c55e"/>
    <!-- 5 bearish: drops back toward swing low -->
    <line x1="310" y1="180" x2="310" y2="255" stroke="#ef4444"/><rect x="298" y="195" width="24" height="45" fill="#ef4444"/>

    <!-- 6: SWEEP CANDLE — wick stabs to 96 (y=380), closes back at 108 (y=220) -->
    <line x1="380" y1="170" x2="380" y2="380" stroke="#eab308" stroke-width="3"/>
    <rect x="368" y="185" width="24" height="55" fill="#ef4444"/>
    <!-- wick label -->
    <text x="395" y="375" fill="#eab308" font-size="12">Wick = stops triggered</text>
    <text x="395" y="390" fill="#eab308" font-size="12">buyers absorb the selling</text>
    <circle cx="380" cy="380" r="8" fill="none" stroke="#eab308" stroke-width="2"/>

    <!-- 7: first recovery candle — closes above swing low -->
    <line x1="450" y1="155" x2="450" y2="250" stroke="#22c55e"/><rect x="438" y="170" width="24" height="65" fill="#22c55e"/>

    <!-- BUY signal arrow at candle 7 -->
    <polygon points="450,130 442,155 458,155" fill="#22c55e"/>
    <text x="435" y="120" fill="#22c55e" font-size="13" font-weight="bold">BUY</text>

    <!-- 8: continuation -->
    <line x1="520" y1="100" x2="520" y2="175" stroke="#22c55e"/><rect x="508" y="115" width="24" height="50" fill="#22c55e"/>
    <!-- 9: continuation -->
    <line x1="590" y1="75" x2="590" y2="140" stroke="#22c55e"/><rect x="578" y="88" width="24" height="42" fill="#22c55e"/>
    <!-- 10 -->
    <line x1="660" y1="65" x2="660" y2="115" stroke="#22c55e"/><rect x="648" y="78" width="24" height="30" fill="#22c55e"/>
  </g>

  <!-- annotations -->
  <text x="310" y="415" fill="#64748b" font-size="12">Candle 6 = sweep (wick below swing low, close back above)</text>
  <text x="310" y="430" fill="#64748b" font-size="12">Candle 7 = close above swing low = BUY signal confirmation</text>
</svg>
