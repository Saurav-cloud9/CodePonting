<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="monospace">
  <rect width="760" height="480" fill="#0f172a"/>

  <!-- title -->
  <text x="20" y="28" fill="#e2e8f0" font-size="15" font-weight="bold">How Liquidity Sweep Generates a BUY Signal</text>

  <!-- phase backgrounds -->
  <rect x="40"  y="45" width="200" height="330" rx="6" fill="#ef4444" opacity="0.06"/>
  <rect x="255" y="45" width="160" height="330" rx="6" fill="#eab308" opacity="0.08"/>
  <rect x="430" y="45" width="290" height="330" rx="6" fill="#22c55e" opacity="0.07"/>

  <!-- phase labels -->
  <text x="80"  y="65" fill="#ef4444" font-size="12" font-weight="bold">PHASE 1: DOWNTREND</text>
  <text x="260" y="65" fill="#eab308" font-size="12" font-weight="bold">PHASE 2: SWEEP</text>
  <text x="440" y="65" fill="#22c55e" font-size="12" font-weight="bold">PHASE 3: BUY SIGNAL</text>

  <!-- grid lines -->
  <line x1="40" y1="110" x2="720" y2="110" stroke="#1e293b" stroke-width="1"/>
  <line x1="40" y1="190" x2="720" y2="190" stroke="#1e293b" stroke-width="1"/>
  <line x1="40" y1="270" x2="720" y2="270" stroke="#1e293b" stroke-width="1"/>
  <line x1="40" y1="350" x2="720" y2="350" stroke="#1e293b" stroke-width="1"/>

  <!-- price labels -->
  <text x="8" y="114" fill="#64748b" font-size="11">120</text>
  <text x="8" y="194" fill="#64748b" font-size="11">114</text>
  <text x="8" y="274" fill="#64748b" font-size="11">108</text>
  <text x="8" y="354" fill="#64748b" font-size="11">102</text>

  <!-- SWING LOW LINE (at y=270 = 108) -->
  <line x1="170" y1="270" x2="720" y2="270" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="8,5"/>
  <rect x="40" y="258" width="120" height="24" rx="4" fill="#1e1535"/>
  <text x="48" y="274" fill="#a78bfa" font-size="11" font-weight="bold">Swing Low = 108</text>

  <!-- stop loss zone label below swing low -->
  <rect x="175" y="278" width="180" height="20" rx="3" fill="#1e1535"/>
  <text x="183" y="291" fill="#a78bfa" font-size="11">Stop losses parked below 108</text>

  <!-- PHASE 1 CANDLES: downtrend, 5 candles -->
  <!-- C1 bearish -->
  <line x1="80"  y1="120" x2="80"  y2="200" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="68"  y="135" width="24" height="50" rx="2" fill="#ef4444"/>

  <!-- C2 bearish -->
  <line x1="135" y1="155" x2="135" y2="235" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="123" y="170" width="24" height="50" rx="2" fill="#ef4444"/>

  <!-- C3 bearish: FORMS SWING LOW, close = 108 (y=270) -->
  <line x1="190" y1="200" x2="190" y2="285" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="178" y="215" width="24" height="55" rx="2" fill="#ef4444"/>
  <!-- swing low dot -->
  <circle cx="190" cy="285" r="5" fill="#a78bfa"/>
  <text x="155" y="308" fill="#a78bfa" font-size="10">swing low</text>
  <text x="158" y="320" fill="#a78bfa" font-size="10">forms here</text>

  <!-- C4 small bullish: slight bounce -->
  <line x1="245" y1="215" x2="245" y2="290" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="233" y="230" width="24" height="45" rx="2" fill="#22c55e"/>

  <!-- PHASE 2: SWEEP CANDLE -->
  <!-- C5 SWEEP: open=114, wick goes to 98 (y=382), close=112 -->
  <line x1="335" y1="175" x2="335" y2="400" stroke="#eab308" stroke-width="3"/>
  <rect x="323" y="190" width="24" height="60" rx="2" fill="#ef4444"/>

  <!-- sweep wick circle + label -->
  <circle cx="335" cy="400" r="8" fill="none" stroke="#eab308" stroke-width="2.5"/>
  <text x="355" y="395" fill="#eab308" font-size="11">Stops triggered here</text>
  <text x="355" y="410" fill="#eab308" font-size="11">Big buyers absorb selling</text>

  <!-- arrows showing stop orders hit -->
  <text x="285" y="330" fill="#a78bfa" font-size="18" opacity="0.7">▼</text>
  <text x="285" y="350" fill="#a78bfa" font-size="18" opacity="0.5">▼</text>
  <text x="285" y="370" fill="#a78bfa" font-size="18" opacity="0.3">▼</text>

  <!-- PHASE 3: BUY SIGNAL CANDLES -->
  <!-- C6: closes back above swing low (108) — first confirmation -->
  <line x1="480" y1="180" x2="480" y2="285" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="468" y="195" width="24" height="75" rx="2" fill="#22c55e"/>

  <!-- BUY arrow + label for C6 -->
  <polygon points="480,148 470,175 490,175" fill="#22c55e"/>
  <rect x="455" y="125" width="50" height="22" rx="4" fill="#14532d"/>
  <text x="465" y="140" fill="#22c55e" font-size="13" font-weight="bold">BUY</text>
  <text x="440" y="165" fill="#22c55e" font-size="10">Close above 108</text>
  <text x="438" y="177" fill="#22c55e" font-size="10">= entry confirmed</text>

  <!-- C7 continuation -->
  <line x1="545" y1="140" x2="545" y2="215" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="533" y="155" width="24" height="48" rx="2" fill="#22c55e"/>

  <!-- C8 continuation -->
  <line x1="610" y1="105" x2="610" y2="170" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="598" y="118" width="24" height="42" rx="2" fill="#22c55e"/>

  <!-- C9 continuation -->
  <line x1="675" y1="82" x2="675" y2="138" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="663" y="95" width="24" height="36" rx="2" fill="#22c55e"/>

  <!-- overall price path line to show flow -->
  <polyline fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"
    points="80,160 135,195 190,245 245,252 335,230 480,235 545,178 610,138 675,112"/>

  <!-- bottom legend -->
  <rect x="40" y="430" width="680" height="38" rx="5" fill="#1e293b"/>
  <text x="60" y="446" fill="#a78bfa" font-size="11">Purple dashed = swing low (liquidity level)</text>
  <text x="60" y="461" fill="#eab308" font-size="11">Yellow = sweep candle (stops triggered, wick below swing low)</text>
  <text x="420" y="446" fill="#22c55e" font-size="11">Green = buy signal + continuation</text>
  <text x="420" y="461" fill="#94a3b8" font-size="11">Gray dashed = approximate price path</text>
</svg>
