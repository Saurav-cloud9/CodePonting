<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CodePonting — Quick Backtest</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0d0f14;
    --panel: #13161e;
    --border: #1e2330;
    --accent: #00e5ff;
    --green: #00e676;
    --red: #ff1744;
    --yellow: #ffd600;
    --text: #c8d0e0;
    --muted: #4a5568;
    --font: 'Courier New', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 12px; }
  
  #header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
  #header h1 { font-size: 13px; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
  #header span { color: var(--muted); font-size: 11px; }
  
  #main { display: grid; grid-template-columns: 220px 1fr; height: calc(100vh - 42px); }
  
  /* ── LEFT PANEL ── */
  #controls { background: var(--panel); border-right: 1px solid var(--border); padding: 12px; overflow-y: auto; }
  .section-title { color: var(--muted); font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; margin: 12px 0 6px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  .field { margin-bottom: 8px; }
  .field label { display: block; color: var(--muted); font-size: 10px; margin-bottom: 3px; }
  .field input, .field select { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 5px 8px; font-family: var(--font); font-size: 12px; border-radius: 2px; }
  .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
  
  #run-btn { width: 100%; margin-top: 14px; padding: 9px; background: var(--accent); color: #000; font-family: var(--font); font-size: 12px; font-weight: bold; letter-spacing: 1px; border: none; cursor: pointer; text-transform: uppercase; }
  #run-btn:hover { background: #26c6da; }
  #dl-btn { width: 100%; margin-top: 6px; padding: 9px; background: transparent; color: var(--green); font-family: var(--font); font-size: 12px; font-weight: bold; letter-spacing: 1px; border: 1px solid var(--green); cursor: pointer; text-transform: uppercase; display: none; }
  #dl-btn:hover { background: #00e67610; }
  
  /* ── STATS BAR ── */
  #stats-bar { display: flex; gap: 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .stat { padding: 8px 14px; border-right: 1px solid var(--border); min-width: 90px; }
  .stat .label { color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: 1px; }
  .stat .value { font-size: 14px; font-weight: bold; margin-top: 2px; }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .neu { color: var(--accent); }
  
  /* ── RIGHT PANEL ── */
  #right { display: flex; flex-direction: column; }
  #chart-area { flex: 1; position: relative; min-height: 0; padding: 8px; }
  canvas { width: 100% !important; }
  
  /* ── TRADE TABLE ── */
  #trades-panel { height: 180px; overflow-y: auto; border-top: 1px solid var(--border); }
  #trades-panel table { width: 100%; border-collapse: collapse; font-size: 11px; }
  #trades-panel th { position: sticky; top: 0; background: var(--panel); color: var(--muted); text-align: left; padding: 5px 10px; border-bottom: 1px solid var(--border); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
  #trades-panel td { padding: 4px 10px; border-bottom: 1px solid #1a1f2a; }
  #trades-panel tr:hover td { background: #16192200; }

  #no-trades { color: var(--muted); padding: 20px; text-align: center; }
  
  .badge { display: inline-block; padding: 1px 6px; font-size: 10px; border-radius: 2px; }
  .badge.long { background: #00e67620; color: var(--green); border: 1px solid #00e67640; }
  .badge.short { background: #ff174420; color: var(--red); border: 1px solid #ff174440; }
  .badge.win { color: var(--green); }
  .badge.loss { color: var(--red); }

  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<div id="header">
  <h1>⚡ CodePonting Backtest</h1>
  <span>TATAMOTORS · Daily · 50-MA Bounce Strategy</span>
</div>

<div id="main">
  <!-- LEFT CONTROLS -->
  <div id="controls">
    <div class="section-title">Strategy</div>
    <div class="field">
      <label>Strategy</label>
      <select id="strat">
        <option value="ma_bounce">50-MA Bounce (Rayner)</option>
        <option value="ma_cross">50/200 MA Crossover</option>
      </select>
    </div>

    <div class="section-title">MA Settings</div>
    <div class="field"><label>Fast MA Period</label><input type="number" id="ma_fast" value="50" min="5" max="200"></div>
    <div class="field"><label>Slow MA Period (cross only)</label><input type="number" id="ma_slow" value="200" min="20" max="400"></div>

    <div class="section-title">Exit Rules</div>
    <div class="field"><label>Stop Loss (ATR multiplier)</label><input type="number" id="sl_atr" value="1.0" min="0.5" max="5" step="0.1"></div>
    <div class="field"><label>ATR Period</label><input type="number" id="atr_period" value="14" min="5" max="30"></div>
    <div class="field">
      <label>Take Profit</label>
      <select id="tp_mode">
        <option value="swing">Swing High/Low</option>
        <option value="rr15">Fixed 1.5R</option>
        <option value="rr2">Fixed 2.0R</option>
        <option value="rr3">Fixed 3.0R</option>
      </select>
    </div>

    <div class="section-title">Date Range</div>
    <div class="field"><label>From</label><input type="date" id="date_from" value="2022-01-01"></div>
    <div class="field"><label>To</label><input type="date" id="date_to" value="2025-12-31"></div>

    <button id="run-btn" onclick="runBacktest()">▶ RUN BACKTEST</button>
    <button id="dl-btn" onclick="downloadCSV()">⬇ DOWNLOAD CSV</button>
  </div>

  <!-- RIGHT PANEL -->
  <div id="right">
    <div id="stats-bar">
      <div class="stat"><div class="label">CAGR</div><div class="value neu" id="s-cagr">—</div></div>
      <div class="stat"><div class="label">Win Rate</div><div class="value neu" id="s-wr">—</div></div>
      <div class="stat"><div class="label">Total Trades</div><div class="value neu" id="s-trades">—</div></div>
      <div class="stat"><div class="label">Avg R:R</div><div class="value neu" id="s-rr">—</div></div>
      <div class="stat"><div class="label">Max DD</div><div class="value neu" id="s-dd">—</div></div>
      <div class="stat"><div class="label">Final Return</div><div class="value neu" id="s-ret">—</div></div>
    </div>

    <div id="chart-area">
      <canvas id="mainChart"></canvas>
    </div>

    <div id="trades-panel">
      <div id="no-trades" style="display:block">Run backtest to see trades</div>
      <table id="trade-table" style="display:none">
        <thead>
          <tr>
            <th>Entry Date</th><th>Exit Date</th><th>Dir</th>
            <th>Entry ₹</th><th>Exit ₹</th><th>Exit Reason</th>
            <th>P&L %</th><th>R:R</th>
          </tr>
        </thead>
        <tbody id="trade-body"></tbody>
      </table>
    </div>
  </div>
</div>

// ── INDICATORS ────────────────────────────────────────────────
function sma(closes, period) {
  return closes.map((_, i) => {
    if (i < period - 1) return null;
    const slice = closes.slice(i - period + 1, i + 1);
    return slice.reduce((a, b) => a + b, 0) / period;
  });
}

function atr(data, period) {
  const trs = data.map((d, i) => {
    if (i === 0) return d[2] - d[3];
    const prevClose = data[i-1][4];
    return Math.max(d[2] - d[3], Math.abs(d[2] - prevClose), Math.abs(d[3] - prevClose));
  });
  return trs.map((_, i) => {
    if (i < period - 1) return null;
    return trs.slice(i - period + 1, i + 1).reduce((a, b) => a + b, 0) / period;
  });
}

function swingHigh(highs, lookback, i) {
  const start = Math.max(0, i - lookback);
  return Math.max(...highs.slice(start, i));
}

function swingLow(lows, lookback, i) {
  const start = Math.max(0, i - lookback);
  return Math.min(...lows.slice(start, i));
}

// ── BACKTEST ENGINE ───────────────────────────────────────────
let chartInstance = null;
let lastTrades = [];
let lastStats = {};

function runBacktest() {
  const strat    = document.getElementById('strat').value;
  const maFast   = parseInt(document.getElementById('ma_fast').value);
  const maSlow   = parseInt(document.getElementById('ma_slow').value);
  const slAtr    = parseFloat(document.getElementById('sl_atr').value);
  const atrPer   = parseInt(document.getElementById('atr_period').value);
  const tpMode   = document.getElementById('tp_mode').value;
  const dateFrom = document.getElementById('date_from').value;
  const dateTo   = document.getElementById('date_to').value;

  // Filter by date
  const data = RAW.filter(d => d[0] >= dateFrom && d[0] <= dateTo);
  if (data.length < maFast + 10) { alert('Not enough data for selected range/MA period'); return; }

  const closes = data.map(d => d[4]);
  const highs  = data.map(d => d[2]);
  const lows   = data.map(d => d[3]);
  const dates  = data.map(d => d[0]);

  const maF  = sma(closes, maFast);
  const maS  = sma(closes, maSlow);
  const atrV = atr(data, atrPer);

  const trades = [];
  lastTrades = trades;
  let inTrade = false;
  let trade = null;

  const SWING_LB = 10;
  const MA_TOUCH_PCT = 0.02; // 2% proximity = "near MA"

  for (let i = Math.max(maFast, maSlow, atrPer) + 1; i < data.length - 1; i++) {
    if (!maF[i] || !atrV[i]) continue;

    const close = closes[i];
    const ma    = maF[i];
    const prevMa = maF[i-1];

    if (!inTrade) {
      let signal = null;

      if (strat === 'ma_bounce') {
        // Uptrend: close above MA, MA rising, price touched MA area from above
        const maTouchLong  = close > ma && Math.abs(close - ma) / ma < MA_TOUCH_PCT && close > closes[i-1];
        const maTouchShort = close < ma && Math.abs(close - ma) / ma < MA_TOUCH_PCT && close < closes[i-1];
        const uptrend   = ma > prevMa && closes[i-5] < close; 
        const downtrend = ma < prevMa && closes[i-5] > close;

        if (uptrend && maTouchLong)   signal = 'LONG';
        if (downtrend && maTouchShort) signal = 'SHORT';

      } else { // ma_cross
        const prevMaS = maS[i-1];
        if (!prevMaS || !maS[i]) continue;
        if (maF[i-1] <= maS[i-1] && maF[i] > maS[i]) signal = 'LONG';
        if (maF[i-1] >= maS[i-1] && maF[i] < maS[i]) signal = 'SHORT';
      }

      if (signal) {
        const entryPrice = data[i+1][1]; // next open
        const swL = swingLow(lows, SWING_LB, i);
        const swH = swingHigh(highs, SWING_LB, i);
        const atrVal = atrV[i];

        let sl, tp;
        if (signal === 'LONG') {
          sl = swL - slAtr * atrVal;
          const risk = entryPrice - sl;
          if (tpMode === 'swing')  tp = swingHigh(highs, SWING_LB * 2, i) * 0.99;
          else if (tpMode === 'rr15') tp = entryPrice + 1.5 * risk;
          else if (tpMode === 'rr2')  tp = entryPrice + 2.0 * risk;
          else                        tp = entryPrice + 3.0 * risk;
        } else {
          sl = swH + slAtr * atrVal;
          const risk = sl - entryPrice;
          if (tpMode === 'swing')  tp = swingLow(lows, SWING_LB * 2, i) * 1.01;
          else if (tpMode === 'rr15') tp = entryPrice - 1.5 * risk;
          else if (tpMode === 'rr2')  tp = entryPrice - 2.0 * risk;
          else                        tp = entryPrice - 3.0 * risk;
        }

        if (sl > 0 && tp > 0 && entryPrice > 0) {
          inTrade = true;
          trade = { dir: signal, entryIdx: i+1, entryDate: dates[i+1] || dates[i], entryPrice, sl, tp };
        }
      }

    } else {
      // Check exit
      const high  = highs[i];
      const low   = lows[i];
      let exitPrice = null, exitReason = null;

      if (trade.dir === 'LONG') {
        if (low <= trade.sl)  { exitPrice = trade.sl;  exitReason = 'SL'; }
        else if (high >= trade.tp) { exitPrice = trade.tp; exitReason = 'TP'; }
      } else {
        if (high >= trade.sl) { exitPrice = trade.sl;  exitReason = 'SL'; }
        else if (low <= trade.tp)  { exitPrice = trade.tp; exitReason = 'TP'; }
      }

      if (exitPrice) {
        const pnlPct = trade.dir === 'LONG'
          ? (exitPrice - trade.entryPrice) / trade.entryPrice * 100
          : (trade.entryPrice - exitPrice) / trade.entryPrice * 100;
        const risk   = Math.abs(trade.entryPrice - trade.sl);
        const reward = Math.abs(exitPrice - trade.entryPrice);
        const rr     = risk > 0 ? reward / risk : 0;

        trades.push({ ...trade, exitDate: dates[i], exitPrice, exitReason, pnlPct, rr });
        inTrade = false;
        trade = null;
      }
    }
  }

  // ── STATS ─────────────────────────────────────────────────
  const n = trades.length;
  const wins = trades.filter(t => t.pnlPct > 0).length;
  const winRate = n > 0 ? (wins / n * 100).toFixed(1) : 0;
  const totalPnl = trades.reduce((s, t) => s + t.pnlPct, 0);
  const avgRR = n > 0 ? (trades.reduce((s, t) => s + t.rr, 0) / n).toFixed(2) : 0;

  // Equity curve
  let equity = 100;
  const equityCurve = [100];
  trades.forEach(t => { equity *= (1 + t.pnlPct / 100); equityCurve.push(+equity.toFixed(2)); });
  const finalRet = (equity - 100).toFixed(1);

  // CAGR
  const days = data.length;
  const years = days / 252;
  const cagr = n > 0 ? ((Math.pow(equity / 100, 1 / years) - 1) * 100).toFixed(1) : 0;

  // Max DD
  let peak = 100, maxDD = 0;
  equityCurve.forEach(e => {
    if (e > peak) peak = e;
    const dd = (peak - e) / peak * 100;
    if (dd > maxDD) maxDD = dd;
  });

  // ── UPDATE STATS BAR ─────────────────────────────────────
  const set = (id, val, pos) => {
    const el = document.getElementById(id);
    el.textContent = val;
    el.className = 'value ' + (pos === null ? 'neu' : pos ? 'pos' : 'neg');
  };
  set('s-cagr',   cagr + '%',        cagr > 0);
  set('s-wr',     winRate + '%',      winRate > 50);
  set('s-trades', n,                  null);
  set('s-rr',     avgRR + 'R',        avgRR > 1);
  set('s-dd',     '-' + maxDD.toFixed(1) + '%', false);
  set('s-ret',    (finalRet > 0 ? '+' : '') + finalRet + '%', finalRet > 0);

  lastStats = {
    strategy: strat, maFast, maSlow, slAtr, atrPer, tpMode, dateFrom, dateTo,
    totalTrades: n, winRate, avgRR, cagr, maxDD: maxDD.toFixed(1), finalReturn: finalRet
  };
  document.getElementById('dl-btn').style.display = n > 0 ? 'block' : 'none';

  // ── CHART ─────────────────────────────────────────────────
  if (chartInstance) chartInstance.destroy();
  const ctx = document.getElementById('mainChart').getContext('2d');

  // Subsample labels for readability
  const step = Math.max(1, Math.floor(data.length / 60));
  const chartLabels = dates.filter((_, i) => i % step === 0);
  const chartClose  = closes.filter((_, i) => i % step === 0);
  const chartMaF    = maF.filter((_, i) => i % step === 0);
  const chartMaS    = maS.filter((_, i) => i % step === 0);

  // Entry/exit markers on price chart
  const entryPoints = new Array(chartLabels.length).fill(null);
  const exitPoints  = new Array(chartLabels.length).fill(null);
  trades.forEach(t => {
    const ei = chartLabels.indexOf(t.entryDate);
    const xi = chartLabels.indexOf(t.exitDate);
    if (ei >= 0) entryPoints[ei] = t.entryPrice;
    if (xi >= 0) exitPoints[xi]  = t.exitPrice;
  });

  // Equity curve chart labels
  const eqLabels = trades.map(t => t.exitDate);
  eqLabels.unshift(dates[0]);

  chartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: chartLabels,
      datasets: [
        {
          label: 'Close',
          data: chartClose,
          borderColor: '#4a5568',
          borderWidth: 1,
          pointRadius: 0,
          yAxisID: 'y',
          order: 3,
        },
        {
          label: `MA${maFast}`,
          data: chartMaF,
          borderColor: '#00e5ff',
          borderWidth: 1.5,
          pointRadius: 0,
          yAxisID: 'y',
          order: 2,
        },
        {
          label: `MA${maSlow}`,
          data: chartMaS,
          borderColor: '#ffd600',
          borderWidth: 1,
          pointRadius: 0,
          yAxisID: 'y',
          borderDash: [4, 4],
          order: 2,
        },
        {
          label: 'Entry',
          data: entryPoints,
          borderColor: 'transparent',
          backgroundColor: '#00e676',
          pointRadius: 5,
          pointStyle: 'triangle',
          showLine: false,
          yAxisID: 'y',
          order: 1,
        },
        {
          label: 'Exit',
          data: exitPoints,
          borderColor: 'transparent',
          backgroundColor: '#ff1744',
          pointRadius: 5,
          pointStyle: 'triangle',
          rotation: 180,
          showLine: false,
          yAxisID: 'y',
          order: 1,
        },
        {
          label: 'Equity',
          data: (() => {
            const arr = new Array(chartLabels.length).fill(null);
            equityCurve.forEach((val, idx) => {
              const label = idx === 0 ? dates[0] : (trades[idx-1] ? trades[idx-1].exitDate : null);
              if (label) {
                const ci = chartLabels.indexOf(label);
                if (ci >= 0) arr[ci] = val;
              }
            });
            return arr;
          })(),
          borderColor: '#00e676',
          borderWidth: 2,
          pointRadius: 0,
          fill: false,
          yAxisID: 'y2',
          order: 0,
          tension: 0.3,
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          labels: { color: '#4a5568', font: { size: 10, family: 'Courier New' }, boxWidth: 20 }
        },
        tooltip: {
          backgroundColor: '#13161e',
          borderColor: '#1e2330',
          borderWidth: 1,
          titleColor: '#00e5ff',
          bodyColor: '#c8d0e0',
          titleFont: { family: 'Courier New', size: 11 },
          bodyFont: { family: 'Courier New', size: 10 },
        }
      },
      scales: {
        x: {
          ticks: { color: '#4a5568', font: { size: 9, family: 'Courier New' }, maxRotation: 0, maxTicksLimit: 12 },
          grid: { color: '#1a1f28' }
        },
        y: {
          position: 'left',
          ticks: { color: '#4a5568', font: { size: 9, family: 'Courier New' } },
          grid: { color: '#1a1f28' }
        },
        y2: {
          position: 'right',
          ticks: { color: '#00e67680', font: { size: 9, family: 'Courier New' }, callback: v => v ? v.toFixed(0) : '' },
          grid: { drawOnChartArea: false }
        }
      }
    }
  });

  // ── TRADE TABLE ───────────────────────────────────────────
  document.getElementById('no-trades').style.display = 'none';
  document.getElementById('trade-table').style.display = 'table';
  const tbody = document.getElementById('trade-body');
  tbody.innerHTML = '';
  [...trades].reverse().forEach(t => {
    const row = document.createElement('tr');
    const pnlColor = t.pnlPct > 0 ? 'var(--green)' : 'var(--red)';
    row.innerHTML = `
      <td>${t.entryDate}</td>
      <td>${t.exitDate}</td>
      <td><span class="badge ${t.dir.toLowerCase()}">${t.dir}</span></td>
      <td>₹${t.entryPrice.toFixed(1)}</td>
      <td>₹${t.exitPrice.toFixed(1)}</td>
      <td style="color:${t.exitReason === 'TP' ? 'var(--green)' : 'var(--red)'};">${t.exitReason}</td>
      <td style="color:${pnlColor};">${t.pnlPct > 0 ? '+' : ''}${t.pnlPct.toFixed(2)}%</td>
      <td>${t.rr.toFixed(2)}R</td>
    `;
    tbody.appendChild(row);
  });
}

// ── CSV DOWNLOAD ──────────────────────────────────────────────
function downloadCSV() {
  if (!lastTrades.length) return;

  // Build equity curve values per trade
  let equity = 100;
  const equityAfter = lastTrades.map(t => {
    equity *= (1 + t.pnlPct / 100);
    return +equity.toFixed(4);
  });

  const headers = [
    'trade_num','entry_date','exit_date','direction',
    'entry_price','exit_price','stop_loss','take_profit',
    'exit_reason','pnl_pct','rr','equity_after',
    'strategy','ma_fast','ma_slow','sl_atr','atr_period','tp_mode'
  ];

  const rows = lastTrades.map((t, i) => [
    i + 1,
    t.entryDate,
    t.exitDate,
    t.dir,
    t.entryPrice.toFixed(4),
    t.exitPrice.toFixed(4),
    t.sl.toFixed(4),
    t.tp.toFixed(4),
    t.exitReason,
    t.pnlPct.toFixed(4),
    t.rr.toFixed(4),
    equityAfter[i],
    lastStats.strategy,
    lastStats.maFast,
    lastStats.maSlow,
    lastStats.slAtr,
    lastStats.atrPer,
    lastStats.tpMode
  ]);

  // Summary block at top as comment rows
  const summary = [
    ['# BACKTEST SUMMARY'],
    ['# Date Range', `${lastStats.dateFrom} to ${lastStats.dateTo}`],
    ['# Total Trades', lastStats.totalTrades],
    ['# Win Rate', lastStats.winRate + '%'],
    ['# Avg R:R', lastStats.avgRR + 'R'],
    ['# CAGR', lastStats.cagr + '%'],
    ['# Max Drawdown', '-' + lastStats.maxDD + '%'],
    ['# Final Return', lastStats.finalReturn + '%'],
    ['#'],
  ];

  const csvLines = [
    ...summary.map(r => r.join(',')),
    headers.join(','),
    ...rows.map(r => r.join(','))
  ];

  const blob = new Blob([csvLines.join('\r\n')], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stratEl = document.getElementById('strat');
  const stratName = stratEl.value; // reads live from DOM at download time
  const fname = `backtest_${stratName}_${lastStats.dateFrom}_${lastStats.dateTo}.csv`;
  a.href = url; a.download = fname; a.click();
  URL.revokeObjectURL(url);
}

// Auto-run on load
window.onload = () => setTimeout(runBacktest, 300);
</script>
